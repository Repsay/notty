[project]
name = "notty-home-assistant"
version = "0.4.2"
description = "NOTTY smart litter box integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.13.0"]

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "pytest-cov>=6", "ruff>=0.14", "pillow>=11", "mypy>=2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
