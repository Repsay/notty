litter_box_one_key:
  name: Litter box one-key action
  description: Run one of the NOTTY app one-key litter box actions.
  fields:
    user_device_id:
      name: User device ID
      required: true
      selector:
        text:
    one_key:
      name: One-key action
      required: true
      selector:
        select:
          options:
            - clean
            - level
            - empty
            - sterilize

litter_box_action:
  name: Litter box action
  description: Call a NOTTY litter box action or setting. The litter reminder interval action (set_litter_reminder_days) is available only for an enabled reminder and a changed valid cycle (5–30 days). Reset and trash-bag interval actions remain disabled.
  fields:
    user_device_id:
      name: User device ID
      required: true
      selector:
        text:
    action:
      name: Action
      required: true
      selector:
        select:
          options:
            - one_key
            - set_mode
            - set_key
            - reset_litter_reminder
            - reset_garbage_bag_reminder
            - set_litter_reminder_days
            - set_garbage_bag_reminder_days
            - set_dnd
            - set_language
            - reset_device_weight
            - horizontal_calibration
    data:
      name: Data
      required: false
      selector:
        object:

litter_box_schedule:
  name: Litter box cleaning schedules
  description: List, create, update, enable, disable or delete a NOTTY cleaning plan. Times use the NOTTY schedule clock in HH:MM format, with no timezone conversion. Creating or enabling a plan may schedule cleaning; cleaning mode is left unchanged.
  fields:
    user_device_id:
      name: Physical user device ID
      required: true
      selector:
        text:
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - list
            - create
            - update
            - enable
            - disable
            - delete
    plan_id:
      name: Plan ID
      description: Required for update, enable, disable and delete. Obtain the exact ID with the list operation.
      selector:
        text:
    time:
      name: NOTTY schedule clock
      description: Required for create and update. Enter HH:MM as shown by the NOTTY schedule clock; do not use a timestamp or assume Home Assistant timezone conversion.
      example: "06:30"
      selector:
        text:
