name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check release versions and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH")
          manifest = json.loads(Path("custom_components/notty/manifest.json").read_text())
          project = tomllib.loads(Path("pyproject.toml").read_text())
          if manifest["version"] != tag[1:] or project["project"]["version"] != tag[1:]:
              raise SystemExit("Tag, manifest and project versions must match")
          notes = Path("release-notes") / f"{tag}.md"
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit("Release notes are required for this tag")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "NOTTY $RELEASE_TAG" \
            --notes-file "release-notes/$RELEASE_TAG.md" \
            --latest
